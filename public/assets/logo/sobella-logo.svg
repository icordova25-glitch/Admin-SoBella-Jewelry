    <line x1="1060" y1="740" x2="1250" y2="740" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <text x="800" y="761" text-anchor="middle" class="small gold" font-size="68" font-weight="500">JEWELRY CO.</text>
  </g>

  <text x="800" y="898" text-anchor="middle" class="small black" font-size="42" font-weight="500">WEAR IT. LIVE IN IT. LOVE IT.</text>


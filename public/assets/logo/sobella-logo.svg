<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-label="SOBELLA JEWELRY CO.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#fffdf9"/>
      <stop offset="72%" stop-color="#fdf7f0"/>
      <stop offset="100%" stop-color="#f7efe6"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b48b54"/>
      <stop offset="100%" stop-color="#d5b37a"/>
    </linearGradient>
    <style>
      .black { fill: #111111; }

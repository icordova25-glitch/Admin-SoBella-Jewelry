      .line { fill: none; stroke: #111111; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .small { font-family: 'Montserrat', 'Arial', sans-serif; letter-spacing: 0.42em; }
      .serif { font-family: 'Cinzel', 'Cormorant Garamond', 'Georgia', serif; }
      .script { font-family: 'Cormorant Garamond', 'Georgia', serif; font-style: italic; }
    </style>
  </defs>

  <g transform="translate(0 40)">
    <text x="770" y="355" text-anchor="end" class="serif black" font-size="260" font-weight="400">S</text>
    <text x="805" y="360" text-anchor="start" class="serif gold" font-size="260" font-weight="400">B</text>
    <text x="787" y="455" text-anchor="middle" class="gold serif" font-size="92" font-weight="600">✦</text>
  </g>

  <text x="800" y="625" text-anchor="middle" class="serif black" font-size="140" font-weight="400" letter-spacing="0.32em">SOBELLA</text>

  <g transform="translate(0 22)">
